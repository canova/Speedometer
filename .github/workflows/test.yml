name: CI

on:
    workflow_dispatch:

jobs:
    pdf-safari-diag:
        name: PDFViewer Safari diagnostic
        runs-on: macos-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Branch
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: "package.json"
                  cache: "npm"

            - name: Install Node Packages
              run: npm ci

            - name: Hardware
              run: system_profiler SPDisplaysDataType SPHardwareDataType || true

            - name: Run diagnostic
              run: node tests/ci-debug/pdf-safari-diag.mjs 2>&1 | grep -v "GET /"
